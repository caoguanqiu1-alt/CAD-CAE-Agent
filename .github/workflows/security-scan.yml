name: Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    # Run daily at 06:00 UTC so new CVEs are caught even without a push
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  # Trivy scans the checkout once. Reporting and gating use the same JSON.
  trivy-scan:
    name: Trivy — filesystem, secrets & misconfig
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan repository with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: '.github/trivy.yaml'
          cache-dir: '${{ runner.temp }}/trivy-cache'
          format: 'json'
          output: '${{ runner.temp }}/trivy-results.json'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'
          exit-code: '0'  # Findings are gated after report upload; scanner errors still fail.

      - name: Convert the scan result to SARIF
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --config .github/trivy.yaml \
            --format sarif --exit-code 0 \
            --output "$RUNNER_TEMP/trivy-results.sarif" \
            "$RUNNER_TEMP/trivy-results.json"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ runner.temp }}/trivy-results.sarif'
          category: 'trivy'

      - name: Preserve Trivy reports
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trivy-results.json
            ${{ runner.temp }}/trivy-results.sarif
          retention-days: 14
          if-no-files-found: error

      - name: Fail on CRITICAL/HIGH findings
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --config .github/trivy.yaml \
            --format table --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH --exit-code 1 \
            "$RUNNER_TEMP/trivy-results.json"

  # Audit exact versions from uv.lock on both supported deployment/CI platforms.
  pip-audit:
    name: pip-audit — locked dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install audit tools
        shell: bash
        run: python -m pip install 'uv==0.13.7' 'pip-audit==2.10.1'

      - name: Export and audit locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv export --locked --all-extras --no-emit-project \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
          python -m pip_audit \
            --requirement "$RUNNER_TEMP/audit-requirements.txt" \
            --require-hashes --disable-pip --desc --format markdown \
            2>&1 | tee "$RUNNER_TEMP/pip-audit-results.md"

      - name: Preserve dependency audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/audit-requirements.txt
            ${{ runner.temp }}/pip-audit-results.md
          retention-days: 14
          if-no-files-found: warn

  # Exercise the exact locked runtime whenever security dependencies are updated.
  locked-tests:
    name: Locked dependency regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install 'uv==0.13.7'
      - name: Install locked project and test dependencies
        run: uv sync --locked --extra dev --extra test --extra docs --extra ui
      - name: Run regression suite without live SolidWorks or paid API calls
        env:
          PY_KEY_VALUE_DISABLE_BEARTYPE: 'true'
        run: >-
          uv run --no-sync python -m pytest tests/
          -m "not solidworks_only and not smoke" -n 4 --dist=worksteal

  # ── 3. Bandit — Python SAST ─────────────────────────────────────────────────
  bandit:
    permissions:
      contents: read
      security-events: write
    name: Bandit — Python static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Bandit + SARIF formatter
        # bandit-sarif-formatter registers the 'sarif' output format as a plugin
        run: pip install "bandit[toml]" bandit-sarif-formatter

      - name: Run Bandit (SARIF report)
        # --exit-zero ensures the file is always written even when findings exist;
        # a separate step below gates the build on HIGH severity.
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero

      - name: Upload Bandit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit'

      - name: Fail on HIGH severity findings
        run: |
          bandit -r src/ \
            --severity-level high \
            --confidence-level medium \
            --format txt

  # ── 4. Banned / compromised CDN domain check ────────────────────────────────
  # Belt-and-suspenders grep to catch compromised CDN domains before they
  # reach the built docs or runtime JavaScript.
  banned-cdn-check:
    name: Banned CDN domain check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for known-compromised CDN domains
        run: |
          BANNED=(
            "polyfill\.io"
            "bootcss\.com"
            "bootcdn\.net"
            "freecdn\.cn"
          )
          FOUND=0
          for pat in "${BANNED[@]}"; do
            hits=$(grep -rn -E "$pat" \
                    --include="*.yml" --include="*.yaml" \
                    --include="*.html" --include="*.js" --include="*.ts" \
                    --include="*.py" --include="*.md" --include="*.json" \
                    --exclude="security-scan.yml" \
                    . 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Banned CDN pattern '$pat' found:"
              echo "$hits"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "OK: no banned CDN domains." || exit 1

